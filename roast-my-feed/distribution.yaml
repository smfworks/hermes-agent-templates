name: roast-my-feed
version: 1.0.0
description: "Roast My Feed by SMF Works: a Wrapped-style audit of a public X handle. Witty, never cruel, and every number is real."
hermes_requires: ">=0.22.0"
author: "SMF Works"
license: "MIT"

# Allowlist of shipped files. SPEC.md and PLAN-*.md stay in the working tree
# and do not install. tests/ is included for install-from-checkout.
distribution_owned:
  - SOUL.md
  - AGENTS.md
  - README.md
  - LICENSE
  - config.yaml
  - mcp.json
  - .env.EXAMPLE
  - .gitignore
  - cron/
  - templates/
  - skills/
  - scripts/
  - tests/

env_requires: []
