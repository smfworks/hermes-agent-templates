name: fare-hawk
version: 1.0.0
description: "Fare Hawk by SMF Works. Name a place and dates; get a day-by-day itinerary, three flight and three hotel options, then an opt-in price watch. You book; it watches and reports."
hermes_requires: ">=0.22.0"
author: "SMF Works"
license: "MIT"

# Allowlist of shipped files. SPEC.md and PLAN-*.md stay in the working tree
# and do not install. tests/ is included for install-from-checkout.
distribution_owned:
  - SOUL.md
  - AGENTS.md
  - README.md
  - REVIEW.md
  - LICENSE
  - config.yaml
  - mcp.json
  - .env.EXAMPLE
  - .gitignore
  - cron/
  - templates/
  - skills/
  - scripts/
  - tests/

env_requires: []
