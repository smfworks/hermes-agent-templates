name: gatekeeper-prime

on:
  pull_request:
    paths:
      - "gatekeeper-prime/**"
      - ".github/workflows/gatekeeper-prime.yml"

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Offline gates
        run: bash gatekeeper-prime/tests/smoke.sh
