name: site-signal

on:
  pull_request:
    paths:
      - "site-signal/**"
      - ".github/workflows/site-signal.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test dependencies
        run: python3 -m pip install --disable-pip-version-check -r site-signal/requirements.txt
      - name: Offline tests
        run: bash site-signal/tests/smoke.sh
