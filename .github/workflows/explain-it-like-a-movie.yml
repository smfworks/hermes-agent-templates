name: explain-it-like-a-movie

on:
  pull_request:
    paths:
      - "explain-it-like-a-movie/**"
      - ".github/workflows/explain-it-like-a-movie.yml"

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng poppler-utils fonts-liberation python3-pil
      - name: Contract tests
        run: bash explain-it-like-a-movie/tests/smoke.sh
