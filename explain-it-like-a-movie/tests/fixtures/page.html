  <h1>How honeybees share a feeding site</h1>
  <p>Honeybees run a waggle dance to share direction and distance to food.</p>
  <p>The angle of the waggle run maps to the sun, not to north.</p>
  <p>A longer waggle run means a farther site.</p>
  <p>Bees have a secret contract with a hidden agency.</p>
