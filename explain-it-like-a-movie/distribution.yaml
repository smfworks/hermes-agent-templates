name: explain-it-like-a-movie
version: 1.0.0
description: "Explain It Like a Movie by SMF Works: a 60-second sourced explainer that plays like a trailer."
hermes_requires: ">=0.22.0"
author: "SMF Works"
license: "MIT"

# Allowlist of shipped files. SPEC.md, ENV-NOTES.md, and PLAN-*.md stay in the
# working tree and do not install. tests/ is included for install-from-checkout.
distribution_owned:
  - SOUL.md
  - AGENTS.md
  - README.md
  - REVIEW.md
  - LICENSE
  - config.yaml
  - mcp.json
  - .env.EXAMPLE
  - .gitignore
  - templates/
  - skills/
  - scripts/
  - tests/

env_requires: []
