<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>{{title}}</title>
</head>
<body>
  <article>
    <h1>{{title}}</h1>
    <p>Status: {{status}}</p>
    <section>
      <h2>Script</h2>
      {{script}}
    </section>
    <section>
      <h2>Sources</h2>
      <ol>
        {{sources}}
      </ol>
    </section>
    <section>
      <h2>Shot notes</h2>
      <ul>
        {{shots}}
      </ul>
    </section>
    <section>
      <h2>Captions</h2>
      <h3>X</h3>
      <pre>{{caption_x}}</pre>
      <h3>TikTok</h3>
      <pre>{{caption_tiktok}}</pre>
    </section>
    <p>{{ai_label}}</p>
    <p>{{footer}}</p>
  </article>
</body>
</html>
