<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>{{title}}</title>
</head>
<body>
  <article>
    <h1>{{title}}</h1>
    <p>{{meta}}</p>
    <table>
      <thead>
        <tr>
          <th>Claim</th>
          <th>Verdict</th>
          <th>Primary source</th>
          <th>Independent evidence</th>
          <th>Notes</th>
          <th>Checked on</th>
        </tr>
      </thead>
      <tbody>
        {{rows}}
      </tbody>
    </table>
    <section>
      <h2>Not checkable</h2>
      <p>{{not_checkable}}</p>
    </section>
    <section>
      <h2>Bottom line</h2>
      <p>{{bottom_line}}</p>
    </section>
    <section>
      <h2>What would change my mind</h2>
      <p>{{change_mind}}</p>
    </section>
    <section>
      <h2>Sources</h2>
      <p>{{sources}}</p>
    </section>
    <footer>Try Hermes: AI Claim Checker by SMF Works.</footer>
  </article>
</body>
</html>
