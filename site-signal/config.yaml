# Site Signal — Hermes profile config (SMF Works)
# Toolset key resolved for Hermes v0.22.5 (SPEC.md 8.4 #3): the per-platform
# `platform_toolsets:` map is the current form; the flat `toolsets:` list is legacy.
model:
  default: "grok-4.7"        # public default. Operator may choose another runtime model.
  provider: "auto"
agent:
  reasoning_effort: medium
platform_toolsets:
  cli: [terminal, file, web, browser, todo, memory, delegation, clarify, cronjob, skills]
cron:
  preflight: true
skills:
  config:
    site_signal:
      home: "~/SiteSignal"
      deny_terms_file: "~/.config/grok-fleet/deny-terms.txt"
      max_pages: 25
      default_pages: 5
      rate_limit_rps: 1
      user_agent: "SMFWorks-SiteSignal/1.0 (+https://smfworks.com)"
      grok_model: "grok-4.7"   # optional. A machine-local alias works only where that alias is defined.
      grok_bin: "grok"         # optional. Set GROK_BIN when the Grok Build binary is not on PATH.
      timezone: "America/New_York"
