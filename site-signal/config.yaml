# Site Signal — Hermes profile config (SMF Works)
# Toolset key resolved for Hermes v0.22.5 (SPEC.md 8.4 #3): the per-platform
# `platform_toolsets:` map is the current form; the flat `toolsets:` list is legacy.
model:
  default: "grok-4.7"        # fleet default on mikesai1 per memory. Operator may choose another runtime model.
  provider: "auto"
agent:
  reasoning_effort: medium
platform_toolsets:
  cli: [terminal, file, web, browser, todo, memory, delegation, clarify, cronjob, skills]
cron:
  preflight: true
skills:
  config:
    site_signal:
      home: "~/SiteSignal"
      deny_terms_file: "~/.config/grok-fleet/deny-terms.txt"
      max_pages: 25
      default_pages: 5
      rate_limit_rps: 1
      user_agent: "SMFWorks-SiteSignal/1.0 (+https://smfworks.com)"
      grok_model: "spark-glm"   # GLM 5.3 on this host ([model.spark-glm] in ~/.grok/config.toml, PREREQ-NOTES.md); use "glm-5.3" where a Z.ai connector is configured
      grok_bin: "~/.grok/bin/grok"
      timezone: "America/New_York"
